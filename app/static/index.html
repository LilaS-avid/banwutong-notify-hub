<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="theme-color" content="#12372a">
  <title>班务通 · 通知与报名助手</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero" id="home-top">
      <div>
        <p class="eyebrow">BANWUTONG · MVP 01</p>
        <h1>
          <span class="desktop-title">通知不再沉在群聊里</span>
          <span class="mobile-title">班务通</span>
        </h1>
        <p class="hero-copy">导入一条班级通知，自动整理截止时间、报名材料和事项状态。</p>
      </div>
      <div class="hero-mark" aria-hidden="true">通</div>
    </header>

    <main>
      <section class="metrics" aria-label="事项概览">
        <article><span id="metric-total">0</span><small>全部事项</small></article>
        <article><span id="metric-open">0</span><small>待处理</small></article>
        <article><span id="metric-done">0</span><small>已完成</small></article>
      </section>

      <section class="model-bar" id="model-section" aria-label="模型设置">
        <div>
          <p class="kicker">MODEL</p>
          <strong>通知识别模型</strong>
          <span id="model-note">正在读取模型配置……</span>
        </div>
        <label for="model-provider">
          <span>当前模型</span>
          <select id="model-provider" aria-label="选择通知识别模型">
            <option value="codex">Codex 默认模型</option>
          </select>
        </label>
      </section>

      <div class="workspace">
        <section class="composer panel" id="import-section">
          <div class="section-heading">
            <div>
              <p class="kicker">INGEST</p>
              <h2>导入通知</h2>
            </div>
            <button class="text-button" id="sample-button" type="button">填入示例</button>
          </div>
          <form id="message-form">
            <label for="message-text">原始通知</label>
            <textarea id="message-text" required placeholder="粘贴班级群、邮件或公告中的通知……"></textarea>
            <div class="form-footer">
              <span id="form-status" role="status">消息原文会保留在本机数据库中。</span>
              <button class="primary-button" type="submit">解析并保存</button>
            </div>
          </form>
          <div class="upload-divider"><span>或上传文件</span></div>
          <form id="file-form" class="file-form">
            <input
              id="file-input"
              type="file"
              accept=".txt,.md,.csv,.json,.docx,.pdf,.png,.jpg,.jpeg,.webp"
              required
            >
            <div class="file-footer">
              <span id="file-status">支持 TXT、Markdown、DOCX、PDF 和图片，最大 20 MB。</span>
              <button class="primary-button" type="submit">上传并解析</button>
            </div>
          </form>
        </section>

        <section class="activity-panel panel" id="board-section">
          <div class="section-heading">
            <div>
              <p class="kicker" id="view-kicker">INBOX</p>
              <h2 id="view-title">事项看板</h2>
            </div>
            <div class="view-actions">
              <div class="filters" id="status-filters" role="group" aria-label="筛选事项">
                <button class="filter active" type="button" data-status="">全部</button>
                <button class="filter" type="button" data-status="open">待处理</button>
                <button class="filter" type="button" data-status="completed">已完成</button>
              </div>
              <button
                class="trash-toggle"
                id="trash-toggle"
                type="button"
                aria-expanded="false"
              >
                <span id="trash-label">回收站</span>
                <span id="trash-count">0</span>
              </button>
            </div>
          </div>
          <p class="trash-hint hidden" id="trash-hint">
            删除的事项会保留 7 天，到期后自动彻底删除。
          </p>
          <div id="activity-list" class="activity-list">
            <div class="empty-state">正在读取本机事项……</div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <button class="chat-launcher" id="open-chat" type="button">
    <span class="chat-launcher-mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="chat-launcher-copy">
      <strong>向班务通 AI 提问</strong>
      <small>打开独立对话窗口</small>
    </span>
    <span class="chat-launcher-action">打开对话</span>
  </button>
  <nav class="mobile-nav" id="mobile-nav" aria-label="手机快捷导航">
    <button class="active" type="button" data-mobile-action="board">
      <span aria-hidden="true">≡</span>
      <small>事项</small>
    </button>
    <button type="button" data-mobile-action="import">
      <span aria-hidden="true">＋</span>
      <small>导入</small>
    </button>
    <button type="button" data-mobile-action="chat">
      <span aria-hidden="true">◌</span>
      <small>AI</small>
    </button>
    <button type="button" data-mobile-action="settings">
      <span aria-hidden="true">⚙</span>
      <small>设置</small>
    </button>
  </nav>
  <dialog id="chat-dialog" class="chat-dialog">
    <iframe
      id="chat-frame"
      title="班务通 AI 对话"
      data-src="/chat?embedded=1"
      loading="lazy"
    ></iframe>
  </dialog>
  <script src="/static/app.js" defer></script>
</body>
</html>
