<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="theme-color" content="#12372a">
  <title>登录 · 班务通</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <style>
    :root {
      --ink: #17352b;
      --muted: #65746d;
      --paper: #f5f1e8;
      --line: rgba(23, 53, 43, 0.14);
      --accent: #df6d43;
      --green: #2a6b55;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(223, 109, 67, 0.16), transparent 26rem),
        radial-gradient(circle at 88% 78%, rgba(74, 133, 105, 0.18), transparent 28rem),
        var(--paper);
      font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
    }
    .card {
      width: min(420px, 100%);
      background: rgba(255, 253, 248, 0.96);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 32px 28px;
      box-shadow: 0 24px 60px rgba(48, 62, 53, 0.12);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .brand-mark {
      width: 44px; height: 44px; border-radius: 14px;
      display: grid; place-items: center;
      background: var(--green); color: #fff; font-size: 22px; font-weight: 700;
    }
    .brand strong { font-size: 20px; letter-spacing: 0.04em; }
    .kicker {
      margin: 18px 0 6px; font-size: 11px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--muted);
    }
    h1 { margin: 0; font-size: 24px; line-height: 1.3; }
    p.sub { margin: 8px 0 22px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; margin-bottom: 16px;
      font: inherit; color: var(--ink);
      background: #fff; border: 1px solid var(--line); border-radius: 12px;
    }
    input:focus { outline: 2px solid rgba(42, 107, 85, 0.35); outline-offset: 1px; }
    button {
      width: 100%; padding: 13px 16px; font: inherit; font-weight: 600;
      color: #fff; background: var(--green); border: 0; border-radius: 12px; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .status { min-height: 20px; margin-top: 14px; font-size: 13px; color: var(--accent); }
    .ghost {
      display: block; margin-top: 14px; padding: 11px 14px;
      text-align: center; text-decoration: none;
      color: var(--green); font-size: 14px;
      border: 1px dashed var(--line); border-radius: 12px;
      background: rgba(42, 107, 85, 0.04);
    }
    .ghost:hover { background: rgba(42, 107, 85, 0.09); }
    .foot { margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">通</span>
      <strong>班务通</strong>
    </div>
    <p class="kicker">BANWUTONG · SIGN IN</p>
    <h1>登录后查看班级事项</h1>
    <p class="sub">通知、截止时间和报名材料都在这台服务器上，登录才能查看。</p>
    <form id="login-form" autocomplete="on">
      <label for="username">账号</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">进入班务通</button>
    </form>
    <a class="ghost" id="guest-entry" href="/?guest=1">先直接进入（只读，用本地规则）</a>
    <p class="status" id="status" role="status"></p>
    <p class="foot">建议在手机浏览器里「添加到主屏幕」，之后点图标就能直接进班务通。</p>
  </main>
  <script>
    const form = document.querySelector("#login-form");
    const status = document.querySelector("#status");
    const submit = document.querySelector("#submit");

    // 已有会话就直接进看板，不用再登一次
    fetch("/api/session")
      .then((response) => response.json())
      .then((session) => {
        if (session.authenticated) window.location.replace("/");
      })
      .catch(() => {});

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submit.disabled = true;
      status.textContent = "正在登录……";
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: form.username.value.trim(),
            password: form.password.value,
          }),
        });
        if (!response.ok) {
          const detail = await response.json().catch(() => ({}));
          throw new Error(detail.detail || "登录失败");
        }
        window.location.replace("/");
      } catch (error) {
        status.textContent = error.message;
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
